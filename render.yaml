# Render blueprint for Empire Fashion House.
# The database lives on Neon (not Render). The DATABASE_URL is set
# in the Render dashboard.
services:
  - type: web
    name: empire-fashion-website
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: MONIME_TOKEN
        sync: false
      - key: MONIME_SPACE
        sync: false