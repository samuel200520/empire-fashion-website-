# Render blueprint: one-click deployment for Empire Fashion House.
# In Render: New -> Blueprint -> select this repo. It provisions the
# web service AND a managed PostgreSQL database, wiring the URL together.
services:
  - type: web
    name: empire-fashion-website
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: empire-fashion-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      # Set these in the Render dashboard (they are secrets, not defaults):
      - key: MONIME_TOKEN
        sync: false
      - key: MONIME_SPACE
        sync: false

databases:
  - name: empire-fashion-db
    plan: free
    databaseName: empire_fashion